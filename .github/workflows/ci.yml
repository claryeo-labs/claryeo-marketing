name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Lint, analyse & test (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan, level 9)
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --no-progress

      - name: Tests
        # artisan test reads .env; phpunit.xml supplies the actual test env.
        run: |
          touch .env
          php artisan test

      # Fails on known CVEs in locked dependencies.
      - name: Security audit (Composer)
        run: composer audit --locked --no-interaction
