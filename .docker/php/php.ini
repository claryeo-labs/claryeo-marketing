; ─── Memory & execution ───────────────────────────────────────────────────
memory_limit          = 256M
max_execution_time    = 60
max_input_time        = 60
realpath_cache_size   = 4096K
realpath_cache_ttl    = 600

; ─── File uploads ─────────────────────────────────────────────────────────
upload_max_filesize = 10M
post_max_size       = 12M
max_file_uploads    = 20

; ─── Error handling ───────────────────────────────────────────────────────
error_reporting = E_ALL
display_errors  = Off
log_errors      = On
error_log       = /proc/self/fd/2

; ─── Timezone ─────────────────────────────────────────────────────────────
date.timezone = UTC

; ─── Session ──────────────────────────────────────────────────────────────
session.gc_maxlifetime = 7200

; ─── OPcache  (off in dev – overridden by php-opcache.ini in production) ──
opcache.enable = 0
