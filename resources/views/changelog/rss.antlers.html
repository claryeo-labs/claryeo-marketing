<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom" xmlns:content="http://purl.org/rss/1.0/modules/content/">
    <channel>
        <title>Claryeo changelog</title>
        <link>{{ site_root }}/changelog</link>
        <atom:link href="{{ site_root }}/changelog/rss.xml" rel="self" type="application/rss+xml"/>
        <description>New features, improvements and fixes in Claryeo.</description>
        <language>en</language>
        {{ entries }}
        <item>
            <title>{{ title | sanitize }}</title>
            <link>{{ site_root }}{{ url }}</link>
            <guid isPermaLink="true">{{ site_root }}{{ url }}</guid>
            <pubDate>{{ date_rfc }}</pubDate>
            <description>{{ summary | sanitize }}</description>
            <content:encoded><![CDATA[{{ body_html }}]]></content:encoded>
        </item>
        {{ /entries }}
    </channel>
</rss>
